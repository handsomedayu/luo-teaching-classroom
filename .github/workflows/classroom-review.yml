name: Classroom review evidence

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  push:
    branches:
      - 'codex/classroom-review-infrastructure-*'

permissions:
  contents: read

jobs:
  capture-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate version
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright for this job only
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Build public preview from safe allowlist
        run: node tools/build-review-preview.cjs

      - name: Capture all available classroom pages
        run: node tools/capture-review.cjs

      - name: Run physics model checks
        run: |
          mkdir -p test-results
          node tests/science.cjs
          node -e "const r=require('./test-results/science-results.json');if(r.failed){console.error('Science assertions failed:',r.failed);process.exit(1)}"
          if [ -f tests/advanced-circuits.cjs ]; then node tests/advanced-circuits.cjs; fi

      - name: Upload classroom browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-review-evidence
          path: |
            test-results/classroom-review/
            test-results/science-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload standalone website preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-preview-site
          path: dist-review/
          if-no-files-found: warn
          retention-days: 14
